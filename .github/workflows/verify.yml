name: Verify
on: [push, pull_request]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
